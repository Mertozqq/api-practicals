<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger UI · Телефонный справочник</title>
  <link rel="stylesheet" href="/swagger-assets/swagger-ui.css">
  <style>body{margin:0;background:#fafafa}nav{padding:16px 24px;background:#12352d;color:white;font:14px system-ui}nav a{color:inherit;margin-right:24px}.swagger-ui .topbar{display:none}</style>
</head>
<body>
  <nav><a href="/">← К приложению</a><a href="/redoc">ReDoc</a>Swagger UI · Выберите метод → Try it out → Execute</nav>
  <div id="swagger-ui"></div>
  <script src="/swagger-assets/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      displayRequestDuration: true,
      validatorUrl: null,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout'
    });
  </script>
</body>
</html>
